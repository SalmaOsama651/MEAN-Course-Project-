@if (isOpen) {
  <div 
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    (click)="onClose()">
    
    <div 
      class="modal-box w-full max-w-lg p-6 flex flex-col max-h-[90vh] relative"
      (click)="$event.stopPropagation()">
      
      <div class="relative flex items-center justify-center min-h-[32px] pb-3 mb-4" [class.border-b]="title" [class.border-detective-border]="title">
        
        @if (title) {
          <h3 class="text-xl font-bold font-mono tracking-wide text-detective-gold text-center">
            {{ title }}
          </h3>
        }

        <button
          type="button"
          (click)="onClose()"
          class="absolute right-0 text-detective-muted hover:text-detective-text transition-colors p-1 rounded hover:bg-detective-card-hover"
          aria-label="إغلاق">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="overflow-y-auto flex-1 pr-1 text-detective-text">
        <ng-content></ng-content>
      </div>

    </div>
  </div>
}
