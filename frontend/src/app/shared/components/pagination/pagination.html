<div class="pagination-container">

  <button
    class="pagination-btn"
    [disabled]="currentPage === 1"
    (click)="previousPage()">
    ‹
  </button>

  <button
    *ngFor="let page of pages"
    class="pagination-btn"
    [class.active]="page === currentPage"
    (click)="goToPage(page)">
    {{ page }}
  </button>

  <button
    class="pagination-btn"
    [disabled]="currentPage === totalPages"
    (click)="nextPage()">
    ›
  </button>

</div>
